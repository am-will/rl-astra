services:
  game:
    image: rl-astra:alpha
    container_name: rl-astra-alpha
    restart: unless-stopped
    init: true
    networks:
      game:
        ipv4_address: 172.22.0.3
    ports:
      - "178.156.203.67:50000-50031:50000-50031/udp"
    environment:
      SOCKET_PATH: /app/run/http.sock
      PUBLIC_ORIGIN: https://rl-astra.amwill.dev
      MAX_ROOMS: 1
      RTC_PORT_BEGIN: 50000
      RTC_PORT_END: 50031
      RTC_PUBLIC_IP: 178.156.203.67
      RTC_PRIVATE_IP: 172.22.0.3
      RTC_RELAY_PRIVATE_IP: 172.22.0.2
      LOG_DIR: /app/replays
    env_file: .env.alpha
    volumes:
      - ./replays:/app/replays
      - ./run:/app/run
    mem_limit: 1g
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
    healthcheck:
      test: [CMD, node, -e, "require('http').get({socketPath:'/app/run/http.sock',path:'/api/health'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: nginx:1.30.4-alpine
    container_name: rl-astra-proxy
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./run:/run/rl-astra:ro
    networks: [proxy]
    mem_limit: 64m
    labels:
      traefik.enable: 'true'
      traefik.docker.network: proxy
      traefik.http.routers.rl-astra.rule: Host(`rl-astra.amwill.dev`)
      traefik.http.routers.rl-astra.entrypoints: websecure
      traefik.http.routers.rl-astra.tls: 'true'
      traefik.http.routers.rl-astra.tls.certresolver: le
      traefik.http.services.rl-astra.loadbalancer.server.port: '80'
      traefik.http.routers.rl-astra-http.rule: Host(`rl-astra.amwill.dev`)
      traefik.http.routers.rl-astra-http.entrypoints: web
      traefik.http.routers.rl-astra-http.middlewares: rl-astra-https
      traefik.http.middlewares.rl-astra-https.redirectscheme.scheme: https
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
  turn:
    image: coturn/coturn:4.17.2-r0
    container_name: rl-astra-turn
    user: "1000:1000"
    restart: unless-stopped
    networks:
      game:
        ipv4_address: 172.22.0.2
    ports:
      - "178.156.203.67:3478:3478/udp"
      - "178.156.203.67:3478:3478/tcp"
      - "178.156.203.67:50110-50141:50110-50141/udp"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: [-c, /etc/coturn/turnserver.conf]
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
networks:
  game:
    ipam:
      config:
        - subnet: 172.22.0.0/16
  proxy:
    external: true
